name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install pillow

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/

      - name: Initialize Capacitor App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Loop Merge 2048" "com.games.loop2048" --web-dir "www"
          npx cap add android

      - name: Generate App Icons
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          size = (512, 512)
          img = Image.new('RGBA', size, (18, 18, 29, 255))
          draw = ImageDraw.Draw(img)

          margin = 40
          draw.rounded_rectangle([margin, margin, 512-margin, 512-margin], radius=110, fill=(33, 33, 54, 255))

          colors = [(59, 130, 246), (16, 185, 129), (249, 115, 22), (236, 72, 153)]
          points = [(175, 210), (337, 210), (175, 325), (337, 325)]
          draw.line([points[0], points[1], points[3], points[2]], fill=(255, 255, 255, 180), width=22)

          for pt, clr in zip(points, colors):
              r = 48
              draw.ellipse([pt[0]-r, pt[1]-r, pt[0]+r, pt[1]+r], fill=clr)
              draw.ellipse([pt[0]-r, pt[1]-r, pt[0]+r, pt[1]+r], outline=(255, 255, 255, 255), width=5)

          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          base_res = "android/app/src/main/res"
          for folder, px in densities.items():
              out_dir = os.path.join(base_res, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(out_dir, 'ic_launcher.png'))
              resized.save(os.path.join(out_dir, 'ic_launcher_round.png'))
          EOF

      - name: Sync Web Code to Native
        run: |
          npx cap sync android

      - name: Accept SDK Licenses & Link Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoopMerge2048-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
