name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install pillow

      - name: Prepare Clean Web Assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/

      - name: Initialize Capacitor App & AdMob Plugin
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob
          npx cap init "Drop 2048" "com.games.drop2048" --web-dir "www"
          npx cap add android

      - name: Inject AdMob App ID into AndroidManifest.xml
        run: |
          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, 'r') as f:
              content = f.read()

          admob_meta = """
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
          """
          if "APPLICATION_ID" not in content:
              content = content.replace("</application>", f"{admob_meta}\n    </application>")
              with open(manifest_path, 'w') as f:
                  f.write(content)
              print("AdMob ID injected into manifest.")
          EOF

      - name: Generate Minimal Light App Icons
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          size = (512, 512)
          img = Image.new('RGBA', size, (248, 250, 252, 255))
          draw = ImageDraw.Draw(img)

          draw.rounded_rectangle([30, 30, 482, 482], radius=110, fill=(255, 255, 255, 255), outline=(79, 70, 229, 255), width=8)
          draw.rounded_rectangle([186, 75, 326, 215], radius=28, fill=(245, 158, 11, 255))
          draw.polygon([(256, 240), (236, 220), (276, 220)], fill=(79, 70, 229, 230))
          draw.rounded_rectangle([136, 250, 376, 430], radius=40, fill=(79, 70, 229, 255))

          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          base_res = "android/app/src/main/res"
          for folder, px in densities.items():
              target_dir = os.path.join(base_res, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

              for xml_name in ['ic_launcher.xml', 'ic_launcher_round.xml']:
                  xml_path = os.path.join(target_dir, xml_name)
                  if os.path.exists(xml_path):
                      os.remove(xml_path)
          EOF

      - name: Force Clean Sync Web Assets
        run: |
          npx cap sync android --inline

      - name: Accept SDK Licenses & Link Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Clean Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drop2048-Monetized-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
