name: Build Android Production AAB & APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test ad lifecycle and asset packaging
        run: node --test tests/ads-controller.test.cjs

  build:
    if: github.event_name != 'pull_request'
    needs: test-ads
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install pillow

      - name: Prepare Clean Web Assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html ads-controller.js www/

      - name: Initialize Capacitor App & Install Capacitor Unity Ads Bridge
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install capacitor-unity-ads@1.0.0
          npx cap init "Drop 2048" "com.games.drop2048" --web-dir "www"
          npx cap add android

      - name: Bump Version Code to 10 & Version Name to 1.0.9
        run: |
          python3 - << 'EOF'
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, 'r') as f:
              content = f.read()
          content = content.replace("versionCode 1", "versionCode 10")
          content = content.replace('versionName "1.0"', 'versionName "1.0.9"')
          with open(gradle_path, 'w') as f:
              f.write(content)
          EOF

      - name: Add Unity Ads SDK Dependency to build.gradle
        run: |
          python3 - << 'EOF'
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, 'r') as f:
              content = f.read()
          
          unity_dep = """
          dependencies {
              implementation 'com.unity3d.ads:unity-ads:4.12.5'
          """
          if "com.unity3d.ads:unity-ads" not in content:
              content = content.replace("dependencies {", unity_dep)
              with open(gradle_path, 'w') as f:
                  f.write(content)
          EOF

      - name: Generate Minimal Light App Icons
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          size = (512, 512)
          img = Image.new('RGBA', size, (248, 250, 252, 255))
          draw = ImageDraw.Draw(img)

          draw.rounded_rectangle([30, 30, 482, 482], radius=110, fill=(255, 255, 255, 255), outline=(79, 70, 229, 255), width=8)
          draw.rounded_rectangle([186, 75, 326, 215], radius=28, fill=(245, 158, 11, 255))
          draw.polygon([(256, 240), (236, 220), (276, 220)], fill=(79, 70, 229, 230))
          draw.rounded_rectangle([136, 250, 376, 430], radius=40, fill=(79, 70, 229, 255))

          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          base_res = "android/app/src/main/res"
          for folder, px in densities.items():
              target_dir = os.path.join(base_res, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

              for xml_name in ['ic_launcher.xml', 'ic_launcher_round.xml']:
                  xml_path = os.path.join(target_dir, xml_name)
                  if os.path.exists(xml_path):
                      os.remove(xml_path)
          EOF

      - name: Force Clean Sync Web Assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
          npx cap copy android
          npx cap sync android

      - name: Accept SDK Licenses & Link Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore Original Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release-key.jks

      - name: Build Android Release Bundle (AAB) & APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon

      - name: Sign Android App Bundle (AAB) with Original Key
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/release-key.jks -storepass drop2048pass -keypass drop2048pass android/app/build/outputs/bundle/release/app-release.aab drop2048

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Drop2048-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload Direct Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Drop2048-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Export PEM Certificate for Play Console Reset
        run: |
          keytool -export -rfc -keystore android/release-key.jks -alias drop2048 -storepass drop2048pass -file upload_certificate.pem

      - name: Upload PEM Certificate
        uses: actions/upload-artifact@v4
        with:
          name: upload-certificate-pem
          path: upload_certificate.pem
          retention-days: 7

