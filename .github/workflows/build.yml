name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install pillow

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/

      - name: Initialize Capacitor App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Drop 2048" "com.games.drop2048" --web-dir "www"
          npx cap add android

      - name: Force Clean Default Icons & Generate Custom 2048 Logo
        run: |
          python3 - << 'EOF'
          import os, glob
          from PIL import Image, ImageDraw, ImageFont

          # 1. Base 512x512 Vibrant App Icon Creation
          size = (512, 512)
          img = Image.new('RGBA', size, (15, 16, 22, 255))
          draw = ImageDraw.Draw(img)

          # Background Gradient-like Rounded Container
          draw.rounded_rectangle([30, 30, 482, 482], radius=110, fill=(28, 29, 41, 255), outline=(255, 71, 87, 255), width=8)

          # Top Dropping Cube (Orange / 64)
          draw.rounded_rectangle([186, 75, 326, 215], radius=28, fill=(249, 115, 22, 255))
          # Down Arrow Accent
          draw.polygon([(256, 235), (236, 218), (276, 218)], fill=(255, 255, 255, 220))

          # Bottom Merged Target Cube (Red-Pink / 2048)
          draw.rounded_rectangle([136, 250, 376, 430], radius=40, fill=(255, 71, 87, 255))

          # High-contrast Center Badge
          draw.rounded_rectangle([166, 290, 346, 390], radius=20, fill=(255, 255, 255, 255))
          draw.rounded_rectangle([174, 298, 338, 382], radius=16, fill=(20, 20, 30, 255))

          # Save master icon
          os.makedirs('assets', exist_ok=True)
          img.save('assets/icon.png')

          base_res = "android/app/src/main/res"

          # 2. Clear out any default vector drawables that Android uses to override PNGs
          for f in glob.glob(f"{base_res}/mipmap-*/ic_launcher_*.xml"):
              try: os.remove(f)
              except: pass
          for f in glob.glob(f"{base_res}/drawable/ic_launcher_*.xml"):
              try: os.remove(f)
              except: pass

          # 3. Write icons to all density directories
          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          for folder, px in densities.items():
              out_dir = os.path.join(base_res, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(out_dir, 'ic_launcher.png'))
              resized.save(os.path.join(out_dir, 'ic_launcher_round.png'))
              resized.save(os.path.join(out_dir, 'ic_launcher_foreground.png'))

          print("Successfully injected custom Drop 2048 launcher icons!")
          EOF

      - name: Force Clean Manifest Icons
        run: |
          # Ensure AndroidManifest links cleanly to the generated PNG icons
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/g' android/app/src/main/AndroidManifest.xml

      - name: Sync Web Assets to Native
        run: |
          npx cap sync android

      - name: Accept SDK Licenses & Link Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drop2048-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
