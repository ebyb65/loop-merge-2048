<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feature Graphic Generator</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }
    canvas {
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      border-radius: 16px;
      max-width: 95vw;
      height: auto;
    }
    button {
      margin-top: 24px;
      padding: 16px 32px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }
    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <canvas id="c" width="1024" height="500"></canvas>
  <button onclick="download()">Download 1024x500 Feature Graphic</button>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function drawR(x, y, w, h, r, f, s, lw) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (f) { ctx.fillStyle = f; ctx.fill(); }
      if (s) { ctx.strokeStyle = s; ctx.lineWidth = lw; ctx.stroke(); }
    }

    // Modern Light Zen Background
    const bgGrad = ctx.createLinearGradient(0, 0, 1024, 500);
    bgGrad.addColorStop(0, '#f8fafc');
    bgGrad.addColorStop(1, '#e2e8f0');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1024, 500);

    // Decorative soft accent bubbles
    ctx.beginPath();
    ctx.arc(880, 80, 240, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(99, 102, 241, 0.08)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(120, 420, 220, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(239, 68, 68, 0.06)';
    ctx.fill();

    // Left Side: Typography & Tagline
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    // Badge
    drawR(90, 100, 180, 36, 18, '#ffffff', 'rgba(99, 102, 241, 0.2)', 1.5);
    ctx.fillStyle = '#6366f1';
    ctx.font = '700 13px sans-serif';
    ctx.fillText('✦ MINIMAL PUZZLE', 115, 123);

    // Title
    ctx.fillStyle = '#0f172a';
    ctx.font = '900 68px sans-serif';
    ctx.fillText('DROP 2048', 90, 210);

    // Subtitle
    ctx.fillStyle = '#475569';
    ctx.font = '600 24px sans-serif';
    ctx.fillText('Drop • Merge • 3 Lives System', 90, 260);

    // Feature highlights
    ctx.fillStyle = '#64748b';
    ctx.font = '500 16px sans-serif';
    ctx.fillText('✓ Orthogonal pairs & clusters merge', 90, 315);
    ctx.fillText('✓ Smooth zen pacing & animations', 90, 350);
    ctx.fillText('✓ 15-min life refills & emergency revives', 90, 385);

    // Right Side: Minimalist Game Blocks Display
    // Block 1: 1024 (Cyan/Teal)
    drawR(620, 110, 110, 110, 24, '#06b6d4');
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('1024', 675, 165);

    // Block 2: 2048 (Indigo/Purple Hero Block)
    drawR(750, 150, 160, 160, 34, '#4f46e5');
    ctx.shadowColor = 'rgba(79, 70, 229, 0.35)';
    ctx.shadowBlur = 30;
    ctx.shadowOffsetY = 12;
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 48px sans-serif';
    ctx.fillText('2048', 830, 230);
    ctx.shadowColor = 'transparent';

    // Block 3: 512 (Rose)
    drawR(660, 240, 100, 100, 22, '#e11d48');
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 30px sans-serif';
    ctx.fillText('512', 710, 290);

    // Block 4: Dropping Tile (Gold 2)
    drawR(790, 40, 80, 80, 20, '#f59e0b');
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 38px sans-serif';
    ctx.fillText('2', 830, 80);

    function download() {
      const a = document.createElement('a');
      a.download = 'drop2048-feature-graphic-1024x500.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
